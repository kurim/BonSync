name: Docker

# Baut das Container-Image und veröffentlicht es in der GitHub Container Registry
# (ghcr.io/kurim/bonsync), damit Nutzer es direkt pullen können statt selbst zu bauen.
#
# Tags, die entstehen:
#   - main-Branch            -> :latest (bleeding edge, folgt main's HEAD)
#   - Git-Tag v1.2.3         -> :v1.2.3 (unveränderlich) + :stable (zeigt immer auf den
#                                neuesten Release, NIE auf :latest -- Tags werden nicht
#                                zwingend von main's aktuellem HEAD geschnitten)
#   - Pull Requests          -> nur Build-Test (kein Push), damit Dockerfile-Brüche früh auffallen
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Volle History + Tags, damit `git describe` unten den nächstgelegenen
          # Release-Tag findet.
          fetch-depth: 0

      # QEMU + Buildx für Multi-Arch (amd64 für normale Server/NAS, arm64 für Raspberry Pi & Co.).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App-Version und Image-Tags ableiten
        id: meta
        run: |
          image="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"

          # Exakt auf einem Release-Tag (vX.Y.Z-Push) -> "vX.Y.Z".
          # Commits seit dem letzten Tag -> "vX.Y.Z-N-gSHA" (git describes eigenes Format).
          # Noch keine Tags im Repo -> Fallback auf den kurzen Commit-SHA.
          version=$(git describe --tags --always)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="${image}:${{ github.ref_name }}
          ${image}:stable"
          else
            tags="${image}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build (und Push, außer bei PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          # PRs: nur amd64 bauen (schneller, nur Smoke-Test). Main/Tags: beide Architekturen.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=BonSync
            org.opencontainers.image.description=Supermarkt-Kassenbon-Hub (REWE, PENNY, ROSSMANN, LIDL)
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Ohne diese beiden hängt buildx an jeden Push automatisch eine
          # Provenance-/SBOM-Attestation als eigenes Manifest an, die in GHCR als
          # untagged, unreferenzierte "Version" landet und nie aufgeräumt wird --
          # das ist der Hauptgrund für den Cleanup-Job unten.
          provenance: false
          sbom: false

  cleanup:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # NICHT actions/delete-package-versions: das kennt keine Multi-Arch-Manifestlisten und hat
      # uns damit bereits einmal :latest zerschossen -- es löscht "untagged" Versionen blind, aber
      # bei einem Multi-Arch-Image (buildx) sind die einzelnen amd64/arm64-Kind-Manifeste selbst
      # untagged und werden nur über den getaggten Index referenziert. Landen sie auf der
      # Löschliste, zeigt :latest/:stable danach auf ein Manifest, das nicht mehr existiert
      # ("manifests/sha256:... not found" beim Pull). ghcr-cleanup-action kennt Manifestlisten und
      # rechnet referenzierte Kind-Manifeste korrekt aus der Löschmenge heraus.
      - name: Verwaiste Image-Versionen löschen (Multi-Arch-sicher)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: bonsync
          delete-untagged: true
          exclude-tags: latest,stable
          validate: true
