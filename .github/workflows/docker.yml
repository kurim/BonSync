name: Docker

# Baut das Container-Image und veröffentlicht es in der GitHub Container Registry
# (ghcr.io/kurim/bonsync), damit Nutzer es direkt pullen können statt selbst zu bauen.
#
# Tags, die entstehen:
#   - main-Branch            -> :latest  + :main + :sha-<kurzhash>
#   - Git-Tag v1.2.3         -> :1.2.3 + :1.2 + :1 (+ :latest)
#   - Pull Requests          -> nur Build-Test (kein Push), damit Dockerfile-Brüche früh auffallen
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # QEMU + Buildx für Multi-Arch (amd64 für normale Server/NAS, arm64 für Raspberry Pi & Co.).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Tags und -Labels ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=BonSync
            org.opencontainers.image.description=Supermarkt-Kassenbon-Hub (REWE, PENNY, ROSSMANN, LIDL)

      - name: Build (und Push, außer bei PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          # PRs: nur amd64 bauen (schneller, nur Smoke-Test). Main/Tags: beide Architekturen.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
