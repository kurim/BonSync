name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Bekannte Schwachstellen in Laufzeit-Abhängigkeiten brechen den Build (moderate+).
      - run: npm audit --omit=dev --audit-level=moderate
