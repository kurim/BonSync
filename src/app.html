<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#090d16" />
		<!-- Installierte App auf iOS: Vollbild ohne Safari-Leisten. Statusleiste "default" statt
		     "black-translucent": die Seite beginnt unter der Leiste, und app.css kaschiert den von iOS 27
		     verwischten Rand darunter (Streifen --status-tint-h). -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="BonSync" />
		<!-- Schriften (Manrope, JetBrains Mono, Inter) werden über @fontsource selbst ausgeliefert
		     (siehe app.css) statt von Google Fonts -- keine Drittanbieter-Requests pro Seitenaufruf. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
